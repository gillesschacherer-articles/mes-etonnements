<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archives — Mes étonnements</title>
<meta name="description" content="Tous les numéros de la newsletter Mes étonnements, classés par date et par thème.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">Mes étonnements</a>
  <nav class="nav">
    <a href="index.html">Accueil</a>
    <a href="archives.html" aria-current="page">Archives</a>
    <a href="a-propos.html">À propos</a>
  </nav>
</header>

<section class="hero" style="padding:3rem 1.5rem 2.4rem;">
  <div class="hero-inner">
    <p class="eyebrow">Carnet complet</p>
    <h1 style="font-size:clamp(1.8rem,4vw,2.6rem);">Tous les numéros</h1>
  </div>
</section>

<section class="section">
  <div class="filters" id="filters" role="group" aria-label="Filtrer par thème"></div>
  <ul class="entry-list" id="all-list"></ul>
</section>

<footer class="site-footer">
  <div class="inner">
    <span>© <span id="year"></span> Gilles — Mes étonnements</span>
    <a href="a-propos.html">À propos</a>
  </div>
</footer>

<script src="assets/entries.js"></script>
<script src="assets/render.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const themes = ["Tous", ...new Set(ENTRIES.map(e => e.theme))];
  const filtersEl = document.getElementById("filters");
  const listEl = document.getElementById("all-list");

  function render(theme) {
    const shown = theme === "Tous" ? ENTRIES : ENTRIES.filter(e => e.theme === theme);
    listEl.innerHTML = shown.map(entryRowHTML).join("") ||
      `<li style="padding:1.5rem 0; color:var(--ink-soft);">Aucun numéro pour ce thème pour l'instant.</li>`;
  }

  filtersEl.innerHTML = themes.map((t, i) =>
    `<button aria-pressed="${i === 0}" data-theme="${t}">${t}</button>`
  ).join("");

  filtersEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    filtersEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    render(btn.dataset.theme);
  });

  render("Tous");
</script>

</body>
</html>
